<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#f8fafc" rx="12"/>
  <!-- Bottle Cap -->
  <rect x="130" y="30" width="40" height="25" rx="3" fill="#dc2626" stroke="#334155" stroke-width="2"/>
  <line x1="135" y1="38" x2="165" y2="38" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="135" y1="44" x2="165" y2="44" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Bottle Neck -->
  <path d="M135 55 L165 55 L175 80 L125 80 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <!-- Bottle Body -->
  <rect x="90" y="80" width="120" height="185" rx="12" fill="#fef2f2" stroke="#64748b" stroke-width="2"/>
  <!-- Label -->
  <rect x="96" y="100" width="108" height="145" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Brand Strip -->
  <rect x="96" y="100" width="108" height="28" fill="#7f1d1d"/>
  <text x="150" y="119" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff">INSECTICIDES (INDIA)</text>
  <!-- Product Name -->
  <text x="150" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#0f172a">MONOCIL 36% SL</text>
  <text x="150" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="8.5" fill="#991b1b">Monocrotophos Quick Action</text>
  <!-- Toxicity Triangle -->
  <polygon points="150,172 138,192 162,192" fill="#dc2626" stroke="#334155" stroke-width="1"/>
  <!-- Pack Size & Reg -->
  <rect x="106" y="202" width="88" height="20" rx="3" fill="#f8fafc"/>
  <text x="150" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="10" fill="#334155">500 ML</text>
  <text x="150" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="7" fill="#64748b">CIB &amp; RC REGISTERED</text>
</svg>